<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热搜盲区 · HOT SEARCH BLIND SPOT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e17;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans SC",sans-serif;overflow-x:hidden}

/* ==================== 封面英雄区 ==================== */
.hero{position:relative;height:100vh;min-height:680px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:url('cover_final.jpg') center/cover no-repeat;z-index:1}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,23,0.5) 0%,rgba(10,14,23,0.3) 40%,rgba(10,14,23,0.85) 80%,rgba(10,14,23,1) 100%)}
.hero-bg::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(10,14,23,0.6) 100%);z-index:2}

/* 扫描线效果 */
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);z-index:3;pointer-events:none}

/* 飘浮新闻标题 */
.floating-news{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.floating-news span{position:absolute;color:rgba(255,255,255,0.06);font-size:13px;white-space:nowrap;animation:floatUp 20s linear infinite}
.floating-news span:nth-child(1){top:80%;left:5%;animation-duration:25s}
.floating-news span:nth-child(2){top:90%;left:30%;animation-duration:30s;animation-delay:-5s}
.floating-news span:nth-child(3){top:85%;left:60%;animation-duration:22s;animation-delay:-10s}
.floating-news span:nth-child(4){top:95%;left:80%;animation-duration:28s;animation-delay:-3s}
.floating-news span:nth-child(5){top:75%;left:15%;animation-duration:35s;animation-delay:-15s}
@keyframes floatUp{
  0%{transform:translateY(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-120vh);opacity:0}
}

.hero-content{position:relative;z-index:10;text-align:center;padding:0 40px;animation:heroFadeIn 1.5s ease}
@keyframes heroFadeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.game-tag{display:inline-block;font-size:13px;letter-spacing:6px;color:#c41e3a;border:1px solid rgba(196,30,58,0.4);padding:6px 20px;border-radius:2px;margin-bottom:30px;background:rgba(196,30,58,0.08);backdrop-filter:blur(4px)}
.game-title{font-size:clamp(60px,10vw,140px);font-weight:900;letter-spacing:12px;color:#fff;text-shadow:0 0 60px rgba(196,30,58,0.4),0 4px 20px rgba(0,0,0,0.8);line-height:1;margin-bottom:12px}
.game-subtitle{font-size:clamp(14px,2vw,22px);letter-spacing:8px;color:rgba(255,255,255,0.35);font-weight:300;margin-bottom:40px;text-transform:uppercase}
.game-tagline{font-size:clamp(16px,2.5vw,22px);color:rgba(255,255,255,0.7);letter-spacing:4px;font-weight:300;line-height:2}
.game-tagline .accent{color:#c41e3a;font-weight:500}

.scroll-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,0.3);font-size:12px;letter-spacing:3px;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* ==================== 简介内容区 ==================== */
.intro-section{max-width:900px;margin:0 auto;padding:80px 40px}
.section-label{font-size:12px;letter-spacing:6px;color:#c41e3a;text-transform:uppercase;margin-bottom:12px;font-weight:600}
.section-title{font-size:32px;font-weight:700;color:#fff;margin-bottom:30px;letter-spacing:2px}
.section-title::after{content:"";display:block;width:40px;height:3px;background:#c41e3a;margin-top:12px}

/* 故事背景 */
.story-box{background:rgba(20,25,37,0.6);border-left:3px solid #c41e3a;padding:30px 36px;border-radius:0 8px 8px 0;margin-bottom:60px;backdrop-filter:blur(8px)}
.story-box p{font-size:17px;line-height:2.2;color:#c8c8c8;margin-bottom:16px}
.story-box p:last-child{margin-bottom:0}
.story-box .highlight{color:#c41e3a;font-weight:600}
.story-box .name{color:#4dabf7;font-weight:600}

/* 核心玩法 */
.gameplay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:60px}
.gameplay-card{background:rgba(20,25,37,0.5);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:28px;transition:all 0.3s;backdrop-filter:blur(8px)}
.gameplay-card:hover{border-color:rgba(196,30,58,0.3);transform:translateY(-4px);box-shadow:0 12px 40px rgba(196,30,58,0.1)}
.gameplay-card .icon{font-size:32px;margin-bottom:16px;display:block}
.gameplay-card h3{font-size:17px;color:#fff;margin-bottom:10px;font-weight:600}
.gameplay-card p{font-size:14px;line-height:1.8;color:#888}

/* 游戏特色 */
.features-list{margin-bottom:60px}
.feature-item{display:flex;gap:20px;padding:20px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.feature-item:last-child{border-bottom:none}
.feature-num{font-size:28px;font-weight:900;color:rgba(196,30,58,0.3);min-width:50px;font-family:monospace}
.feature-content h3{font-size:16px;color:#fff;margin-bottom:6px;font-weight:600}
.feature-content p{font-size:14px;line-height:1.8;color:#888}

/* 基本信息 */
.info-table{width:100%;border-collapse:collapse;margin-bottom:60px}
.info-table th,.info-table td{padding:16px 20px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.05);font-size:15px}
.info-table th{color:#888;font-weight:400;width:140px;white-space:nowrap}
.info-table td{color:#e8e8e8}
.info-table .tag{display:inline-block;background:rgba(196,30,58,0.15);color:#c41e3a;padding:2px 10px;border-radius:3px;font-size:13px;margin-right:6px}

/* 防破解声明 */
.anti-crack{background:linear-gradient(135deg,rgba(196,30,58,0.08),rgba(77,171,247,0.05));border:1px solid rgba(196,30,58,0.15);border-radius:12px;padding:30px 36px;margin-bottom:60px}
.anti-crack h3{font-size:18px;color:#c41e3a;margin-bottom:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.anti-crack p{font-size:15px;line-height:2;color:#aaa}
.anti-crack .warn{color:#c41e3a;font-weight:600}

/* 开始按钮 */
.start-section{text-align:center;padding:60px 40px 100px}
.start-btn{display:inline-block;font-size:20px;font-weight:700;letter-spacing:8px;color:#fff;background:linear-gradient(135deg,#c41e3a,#8b0000);padding:18px 60px;border-radius:4px;text-decoration:none;transition:all 0.3s;box-shadow:0 8px 30px rgba(196,30,58,0.3);position:relative;overflow:hidden}
.start-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);opacity:0;transition:opacity 0.3s}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(196,30,58,0.5)}
.start-btn:hover::before{opacity:1}
.start-btn:active{transform:translateY(0)}
.start-hint{margin-top:20px;font-size:13px;color:#555;letter-spacing:2px}

/* 页脚 */
.footer{text-align:center;padding:30px;font-size:12px;color:#444;border-top:1px solid rgba(255,255,255,0.03);letter-spacing:1px}

/* 响应式 */
@media(max-width:768px){
  .intro-section{padding:60px 20px}
  .game-title{letter-spacing:6px}
  .story-box{padding:20px 24px}
  .story-box p{font-size:15px}
  .gameplay-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ==================== 封面英雄区 ==================== -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="scanlines"></div>
  <div class="floating-news">
    <span>化工园区存在违规排放 已立案查处</span>
    <span>张明远今晨从跨江大桥坠亡 初步排除他杀</span>
    <span>全市水质全面检测启动 结果将及时公布</span>
    <span>我市自来水水质检测各项指标正常</span>
    <span>个别小区出现季节性流感聚集 与水质无关</span>
  </div>
  <div class="hero-content">
    <div class="game-tag">现代现实题材 · 社会悬疑推理</div>
    <h1 class="game-title">热搜盲区</h1>
    <div class="game-subtitle">HOT SEARCH BLIND SPOT</div>
    <p class="game-tagline">在信息洪流中，寻找<span class="accent">被掩盖的真相</span></p>
  </div>
  <div class="scroll-hint">向下滚动 了解更多</div>
</section>

<!-- ==================== 开始按钮 ==================== -->
<section class="start-section">
  <a href="index.html" class="start-btn">开始调查</a>
  <p class="start-hint">点击进入调查员系统 · 请使用 PC 浏览器游玩</p>
</section>

<!-- 页脚 -->
<div class="footer">
  《热搜盲区》· HOT SEARCH BLIND SPOT · 献给每一个寻找真相的人
</div>

</body>
</html>
